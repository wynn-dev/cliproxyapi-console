name: Nightly

# Every merge to main publishes a new build to npm under the default `latest` tag.
on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # npm trusted publishing: no token, provenance included

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # `prepare` builds the SPA and the server.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

      # A unique version per build, so npm accepts it and the console can tell nightlies apart.
      - name: Publish
        run: |
          version="$(node -p 'require("./package.json").version.split("-")[0]')-nightly.${{ github.run_number }}"
          npm version "$version" --no-git-tag-version
          npm publish --ignore-scripts --tag latest
