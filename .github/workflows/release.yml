name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A prebuilt package tarball, so `npx <url>` needs no build step and no dev dependencies.
      - run: npm pack && mv cliproxyapi-console-*.tgz cliproxyapi-console.tgz
      - run: gh release create "$GITHUB_REF_NAME" cliproxyapi-console.tgz --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
